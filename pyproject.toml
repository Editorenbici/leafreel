[project]
name = "pagereel"
version = "0.1.0"
description = "Turn any document into a narrated explainer video in many visual styles, with open-weight models on ComfyUI (Comfy SDK)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["comfy-sdk>=0.5.0", "fastapi", "uvicorn[standard]", "pillow", "pypdf", "python-multipart", "httpx"]

[project.scripts]
pagereel = "pagereel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pagereel*"]
[tool.setuptools.package-data]
pagereel = ["styles/*.json", "ui/*", "workflows/*.json"]
